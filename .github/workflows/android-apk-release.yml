name: Mobile Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flare-mobile-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: credential.helper
  GIT_CONFIG_VALUE_0: ''
  GIT_CONFIG_KEY_1: credential.helper
  GIT_CONFIG_VALUE_1: '!gh auth git-credential'

jobs:
  plan:
    if: github.repository == 'Natsuneko3/Flare' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      build_commit: ${{ steps.plan.outputs.build_commit }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release policy and reserve the next version
        id: plan
        run: |
          python3 -B scripts/test_android_release.py
          python3 -B scripts/test_github_android_release.py
          python3 -B scripts/test_github_ios_release.py
          python3 -B scripts/github_android_release.py plan

  android:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.build_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Restore the existing application signing key
        env:
          FLARE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLARE_ANDROID_KEYSTORE_BASE64 }}
        run: python3 -B scripts/github_android_release.py install-signing
      - name: Build and verify the APK update
        id: build
        run: python3 -B scripts/github_android_release.py build
      - uses: actions/upload-artifact@v7
        with:
          name: android-update
          path: ${{ steps.build.outputs.folder }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing files
        if: always()
        run: python3 -B scripts/github_android_release.py cleanup

  ios:
    name: iOS signed update
    needs: plan
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.project.kotlin.native.parallelThreads=1
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.build_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          cache: gradle
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare build tools
        run: |
          brew install xcodegen
          python3 -m pip install PyYAML
      - name: Restore and verify the existing iPhone signing identity
        env:
          FLARE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.FLARE_IOS_CERTIFICATE_P12_BASE64 }}
          FLARE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.FLARE_IOS_CERTIFICATE_PASSWORD }}
          FLARE_IOS_APP_PROFILE_BASE64: ${{ secrets.FLARE_IOS_APP_PROFILE_BASE64 }}
          FLARE_IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.FLARE_IOS_EXTENSION_PROFILE_BASE64 }}
        run: python3 -B scripts/github_ios_release.py install-signing
      - name: Compile and sign the iPhone update
        run: >-
          python3 -B scripts/github_ios_release.py build
          --version-name '${{ needs.plan.outputs.version }}'
          --version-code '${{ needs.plan.outputs.version_code }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ios-update
          path: build/ios-release
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary Apple signing material
        if: always()
        run: python3 -B scripts/github_ios_release.py cleanup

  publish:
    needs: [plan, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.build_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - name: Set up APK validation tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;37.0.0'
      - uses: actions/download-artifact@v8
        with:
          name: android-update
          path: build/android-release/${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: ios-update
          path: build/ios-release
      - name: Publish and read back both verified update packages
        run: python3 -B scripts/github_android_release.py publish
