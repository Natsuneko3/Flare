name: Android APK Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flare-android-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Natsuneko3/Flare' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: '!gh auth git-credential'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Verify publisher contracts
        run: |
          python3 -B scripts/test_android_release.py
          python3 -B scripts/test_github_android_release.py
      - name: Restore the existing application signing key
        env:
          FLARE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLARE_ANDROID_KEYSTORE_BASE64 }}
        run: python3 -B scripts/github_android_release.py install-signing
      - name: Build and verify the next APK update
        id: build
        run: python3 -B scripts/github_android_release.py prepare
      - name: Publish the verified APK and updater manifest
        run: python3 -B scripts/github_android_release.py publish
      - name: Remove signing files
        if: always()
        run: python3 -B scripts/github_android_release.py cleanup
